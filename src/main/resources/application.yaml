spring:
  datasource:
    url: jdbc:mysql://localhost:3306/serverdb
    username: 
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver

  web:
    cors:
      allowed-origins: "https://adover134.github.io"
      allowed-methods: "GET, POST, PUT, DELETE"
      allowed-headers: "*"
      allow-credentials: true

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 443
  ssl:
    key-store-type: PKCS12
    key-store: /home/adfsfsf123/keystore.p12
    key-store-password: 
    key-alias: tomcat
    enabled: true
  servlet:
